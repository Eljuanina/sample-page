name: Deploy Webseite

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Commit-Liste generieren
        run: |
          git log -n 10 \
            --date=format:'%d.%m.%Y %H:%M' \
            --pretty=format:'%s%x1f%an%x1f%ad%x1f%h%x1e' \
          | jq -R -s '
              split("\u001e")
              | map(select(length > 0))
              | map(split("\u001f"))
              | map({message: .[0], author: .[1], date: .[2], sha: .[3]})
            ' > public/commits.json

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

      - name: Deployment auf GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
