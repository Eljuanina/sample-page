<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine Webseite</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      max-width: 560px;
      width: 100%;
      background: #1e293b;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    h1 {
      margin-top: 0;
      font-size: 1.6rem;
    }
    .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .commit-message {
      font-size: 1.2rem;
      margin: 0 0 20px 0;
      padding: 16px;
      background: #0f172a;
      border-radius: 10px;
      border-left: 4px solid #38bdf8;
    }
    .meta {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.6;
    }
    .meta strong {
      color: #f1f5f9;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Meine Webseite</h1>
    <div class="label">Letzte Commit-Message</div>
    <p class="commit-message" id="commit-message">Wird geladen ...</p>
    <div class="meta">
      <div><strong>Autor:</strong> <span id="commit-author">-</span></div>
      <div><strong>Datum:</strong> <span id="commit-date">-</span></div>
      <div><strong>SHA:</strong> <span id="commit-sha">-</span></div>
    </div>
  </div>

  <script>
    fetch("commit-info.json")
      .then(function (response) {
        return response.json();
      })
      .then(function (data) {
        document.getElementById("commit-message").textContent = data.message;
        document.getElementById("commit-author").textContent = data.author;
        document.getElementById("commit-date").textContent = data.date;
        document.getElementById("commit-sha").textContent = data.sha;
      })
      .catch(function () {
        document.getElementById("commit-message").textContent = "Commit-Info konnte nicht geladen werden.";
      });
  </script>
</body>
</html>
