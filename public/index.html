<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine Webseite</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      max-width: 560px;
      width: 100%;
      background: #1e293b;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    h1 {
      margin-top: 0;
      font-size: 1.6rem;
    }
    .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    ul.commit-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .commit-item {
      padding: 14px 16px;
      background: #0f172a;
      border-radius: 10px;
      border-left: 4px solid #38bdf8;
      margin-bottom: 12px;
    }
    .commit-item:first-child {
      border-left-color: #4ade80;
    }
    .commit-message {
      font-size: 1.05rem;
      margin: 0 0 6px 0;
    }
    .commit-meta {
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .commit-meta strong {
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Meine Webseite</h1>
    <div class="label">Letzte Commits</div>
    <ul class="commit-list" id="commit-list">
      <li class="commit-item"><p class="commit-message">Wird geladen ...</p></li>
    </ul>
  </div>

  <script>
    fetch("commits.json")
      .then(function (response) {
        return response.json();
      })
      .then(function (commits) {
        var list = document.getElementById("commit-list");
        list.innerHTML = "";
        commits.forEach(function (commit) {
          var item = document.createElement("li");
          item.className = "commit-item";
          item.innerHTML =
            '<p class="commit-message">' + commit.message + '</p>' +
            '<div class="commit-meta">' +
              '<strong>' + commit.author + '</strong> · ' + commit.date + ' · ' + commit.sha +
            '</div>';
          list.appendChild(item);
        });
      })
      .catch(function () {
        document.getElementById("commit-list").innerHTML =
          '<li class="commit-item"><p class="commit-message">Commits konnten nicht geladen werden.</p></li>';
      });
  </script>
</body>
</html>
